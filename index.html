<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f1c">
<title>What are you here for? · Easton</title>
<style>
  :root{--bg:#0a0f1c;--card:#121a2c;--line:#24324f;--txt:#eef3ff;--muted:#93a3c6;--a:#22d3ee;--b:#a3e635;color-scheme:dark}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(1100px 600px at 50% -200px,#1d2f55,var(--bg));color:var(--txt);padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
  .gate{width:min(760px,100%)}
  .kicker{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--b)}
  h1{margin:12px 0 0;font-size:clamp(40px,8vw,68px);letter-spacing:-1.6px;line-height:1.02;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin:14px 0 0;color:var(--muted);font-size:18px;min-height:1.4em}
  .choices{margin-top:28px;display:grid;gap:14px}
  @media(min-width:720px){.choices{grid-template-columns:1fr 1fr}}
  .choice{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:148px;width:100%;padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;font:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
  .choice:hover,.choice:focus-visible{transform:translateY(-4px) rotate(-.4deg);border-color:var(--a);box-shadow:0 12px 30px -10px rgba(34,211,238,.45);outline:none}
  .choice .emoji{font-size:34px;line-height:1}
  .choice strong{display:block;font-size:clamp(18px,2.4vw,22px);letter-spacing:-.02em}
  .choice small{display:block;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.4}
  .choice .go{margin-top:auto;color:var(--a);font-weight:800}
  .back{margin-top:16px;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:8px 0}
  .back:hover,.back:focus-visible{color:var(--a);outline:none}
  .note{margin:14px 0 0;color:#fdba74;font-size:14px}
  footer{margin-top:28px;color:var(--muted);font-size:13px}
  @media(prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body>
<main class="gate">
  <p class="kicker">Easton</p>
  <h1 id="prompt" tabindex="-1">What are you here for?</h1>
  <p class="lede" id="lede">Pick one. You can switch later.</p>
  <div id="options" class="choices"></div>
  <p class="note" id="note" hidden></p>
  <button type="button" class="back" id="back" hidden>← Previous question</button>
  <noscript>
    <div class="choices">
      <a class="choice" href="games.html"><span class="emoji">🎮</span><span><strong>Pleasure / games</strong><small>Easton's Games. One live, two still plotting.</small></span></a>
      <a class="choice" href="christmas.html"><span class="emoji">🎁</span><span><strong>Christmas list</strong><small>The wish list, and a place to request something.</small></span></a>
    </div>
  </noscript>
  <footer>Easton · 2026</footer>
</main>
<script src="questions.js"></script>
<script>
(function () {
  var cfg = window.EASTON_GATE_CONFIG || { start: "", questions: {} };
  var questions = cfg.questions || {};
  var promptEl = document.getElementById("prompt");
  var ledeEl = document.getElementById("lede");
  var optionsEl = document.getElementById("options");
  var noteEl = document.getElementById("note");
  var backBtn = document.getElementById("back");
  var history = [];
  var currentId = "";

  function setNote(text) {
    noteEl.hidden = !text;
    noteEl.textContent = text || "";
  }

  function safeHref(href) {
    if (!href || typeof href !== "string") return "";
    var trimmed = href.trim();
    if (!trimmed || /^javascript:/i.test(trimmed) || /^data:/i.test(trimmed)) return "";
    return trimmed;
  }

  function optionElement(option) {
    var href = safeHref(option.href);
    var el = href ? document.createElement("a") : document.createElement("button");
    el.className = "choice";
    if (href) {
      el.href = href;
    } else {
      el.type = "button";
      el.addEventListener("click", function () {
        if (!option.next) {
          setNote("This option needs an href or a next question.");
          return;
        }
        if (!questions[option.next]) {
          setNote("No question called \u201c" + option.next + "\u201d yet. Add it to questions.js.");
          return;
        }
        show(option.next, true);
      });
    }
    if (option.emoji) {
      var emoji = document.createElement("span");
      emoji.className = "emoji";
      emoji.setAttribute("aria-hidden", "true");
      emoji.textContent = option.emoji;
      el.appendChild(emoji);
    }
    var text = document.createElement("span");
    var label = document.createElement("strong");
    label.textContent = option.label || "Option";
    text.appendChild(label);
    if (option.detail) {
      var detail = document.createElement("small");
      detail.textContent = option.detail;
      text.appendChild(detail);
    }
    el.appendChild(text);
    var go = document.createElement("span");
    go.className = "go";
    go.setAttribute("aria-hidden", "true");
    go.textContent = href ? "Open \u2192" : "Next \u2192";
    el.appendChild(go);
    return el;
  }

  function show(id, recordHistory) {
    var question = questions[id];
    if (!question) {
      promptEl.textContent = "That question is missing.";
      ledeEl.textContent = "";
      optionsEl.replaceChildren();
      setNote("Nothing is configured for \u201c" + id + "\u201d.");
      return;
    }
    if (recordHistory && currentId) history.push(currentId);
    currentId = id;
    setNote("");
    promptEl.textContent = question.prompt || "";
    ledeEl.textContent = question.lede || "";
    document.title = (question.prompt || "Easton") + " \u00b7 Easton";
    var options = Array.isArray(question.options) ? question.options : [];
    optionsEl.replaceChildren.apply(optionsEl, options.map(optionElement));
    backBtn.hidden = history.length === 0;
  }

  function back() {
    var previous = history.pop();
    if (!previous) return;
    show(previous, false);
    promptEl.focus();
  }

  backBtn.addEventListener("click", back);

  window.EastonGate = {
    config: cfg,
    show: show,
    back: back,
    state: function () {
      return { currentId: currentId, history: history.slice() };
    }
  };

  show(cfg.start, false);
})();
</script>
</body>
</html>
